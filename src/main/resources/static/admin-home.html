<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Buyzon - Admin Dashboard</title>

<link rel="stylesheet" href="/css/style.css" />

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Buyzon Admin
    </div>

    <div class="nav-buttons">

        <button 
            class="btn logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>

<!-- HERO SECTION -->

<section class="hero">

    <div class="hero-content">

        <h1>
            Admin Dashboard
        </h1>

        <p id="welcomeText">
            Welcome Admin
        </p>

    </div>

</section>

<!-- ANALYTICS -->

<section class="features-section">

    <div class="feature-card">

        <h2>
            📦
        </h2>

        <p>
            Product Management
        </p>

    </div>

    <div class="feature-card">

        <h2>
            📈
        </h2>

        <p>
            Store Analytics
        </p>

    </div>

    <div class="feature-card">

        <h2>
            🔐
        </h2>

        <p>
            Secure Admin Controls
        </p>

    </div>

</section>

<!-- ACTION SECTION -->

<section class="products-section">

    <h2 class="section-title">
        Admin Controls
    </h2>

    <div class="features-section">

        <div class="feature-card">

            <h2>
                ➕
            </h2>

            <p style="margin-bottom:20px;">
                Add new products to the store
            </p>

            <button 
                class="btn"
                onclick="window.location.href='/add-product.html'"
            >
                Add Product
            </button>

        </div>

        <div class="feature-card">

            <h2>
                🛍️
            </h2>

            <p style="margin-bottom:20px;">
                Manage and view all products
            </p>

            <button 
                class="btn"
                onclick="window.location.href='/all-products-admin.html'"
            >
                View Products
            </button>

        </div>

        <div class="feature-card">

            <h2>
                ⚙️
            </h2>

            <p style="margin-bottom:20px;">
                Test admin secured APIs
            </p>

            <button 
                class="btn"
                onclick="loadAdminData()"
            >
                Test API
            </button>

        </div>

    </div>

    <!-- API RESULT -->

    <div 
        id="apiResult"
        class="feature-card"
        style="margin-top:40px;"
    ></div>

</section>

<!-- FOOTER -->

<footer class="footer">

    <p>
        © 2026 Buyzon Admin Panel. Built with Spring Boot Security & JWT.
    </p>

</footer>

<script src="/js/admin.js"></script>

</body>

</html>
