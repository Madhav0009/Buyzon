<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

  <div class="container">

    <h2>Customer Login</h2>

    <form id="loginForm">

      <input type="text"
             id="username"
             placeholder="Username"
             required />

      <input type="password"
             id="password"
             placeholder="Password"
             required />

      <button type="submit">
        Login
      </button>

      <br><br>

      <a href="/forgot-password.html">
        Forgot Password?
      </a>

    </form>

    <p id="message"></p>

    <br>

    <a href="/index.html">
      Back
    </a>

  </div>

  <script src="/js/auth.js"></script>

</body>
</html>
