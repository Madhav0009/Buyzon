<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Buyzon - My Cart</title>

<link rel="stylesheet" href="/css/style.css" />

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Buyzon
    </div>

    <div class="nav-buttons">

        <button class="btn" onclick="goBackToShopping()">
            Continue Shopping
        </button>

        <button class="btn logout-btn" onclick="logout()">
            Logout
        </button>

    </div>

</nav>

<!-- CART SECTION -->

<section class="products-section">

    <h1 class="section-title">
        My Shopping Cart
    </h1>

    <p id="welcomeText"></p>

    <!-- CART TABLE -->

    <div id="cartList"></div>

    <!-- CART SUMMARY -->

    <div class="cart-summary">

        <h2 id="cartTotal">
            Total: ₹0
        </h2>

        <button 
            id="checkoutBtn"
            class="btn checkout-btn"
            onclick="checkout()"
        >
            Proceed to Buy
        </button>

    </div>

</section>

<!-- FOOTER -->

<footer class="footer">

    <p>
        © 2026 Buyzon. Secure Shopping Experience.
    </p>

</footer>

<!-- Razorpay -->

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<!-- Customer JS -->

<script src="/js/customer.js"></script>

</body>

</html>
